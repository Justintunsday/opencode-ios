name: Build OpenTUI iOS native renderer (Phase C prep)

# Cross-compiles OpenTUI v0.8.0's native Zig core (`libopentui.dylib`) for iPhoneOS arm64.
# This is preparation for the real TUI: OpenTUI 0.8.0's Node binding needs Node >= 26.4 with
# node:ffi, and the iPhoneOS Node 26 runtime is being built in parallel (build-runtime-node26.yml).
# CI can only validate the library statically; actual loading via node:ffi, shipping it as a CLI
# asset and the device run belong to Phase D (see docs/OPENTUI_IOS.md).
#
# Artifact contract: `opentui-ios-renderer` = libopentui.dylib (Mach-O flags normalized to
# 0x100085 + codesign ad-hoc), libopentui-unmodified.dylib (unmodified Zig Mach-O + codesign
# ad-hoc, A/B device-test variant), opentui-ios-manifest.txt, codesign*.txt, macho-flags-normalize.txt,
# file.txt, otool-L.txt, vtool.txt, SHA256SUMS.
# Signing: Apple `codesign` ad-hoc (NOT ldid: ldid-signed dylibs are mapped non-executable by dyld
# on the device). The flags-normalized primary is an experiment for the Zig-dylib exec mapping:
# clang-built dylibs execute on the device while the Zig-built one is mapped non-executable even
# when codesign signed; the header flags differ (see the manifest). Both variants are shipped so
# the device can A/B test them in one cycle.

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-opentui-ios.sh'
      - 'patches/opentui-ios/**'
      - '.github/workflows/build-opentui-ios.yml'

permissions:
  contents: read

concurrency:
  group: build-opentui-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-renderer:
    name: OpenTUI libopentui.dylib (iPhoneOS arm64; NOT device-verified)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      OPENTUI_BUILD_DIR: dist/opentui-build
      OPENTUI_DIST: dist/opentui-ios-renderer
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          uname -a
          xcodebuild -version || true
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK version: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "codesign: $(xcrun --find codesign)"
          codesign -dvv /bin/true 2>&1 | sed -n '1,3p' || true

      - name: Cache Zig toolchain, OpenTUI checkout and Zig caches
        uses: actions/cache@v4
        with:
          path: |
            dist/opentui-build/zig
            dist/opentui-build/opentui
            dist/opentui-build/zig-cache
          key: opentui-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/opentui-ios/**', 'scripts/build-opentui-ios.sh', '.github/workflows/build-opentui-ios.yml') }}

      - name: Build, sign and statically validate iPhoneOS renderer
        run: bash scripts/build-opentui-ios.sh all

      - name: Show artifact summary
        run: |
          set -euo pipefail
          ls -la dist/opentui-ios-renderer
          echo '--- manifest ---'
          cat dist/opentui-ios-renderer/opentui-ios-manifest.txt
          echo '--- SHA256SUMS ---'
          cat dist/opentui-ios-renderer/SHA256SUMS
          echo '--- file ---'
          file dist/opentui-ios-renderer/libopentui.dylib
          echo '--- codesign (normalized primary) ---'
          cat dist/opentui-ios-renderer/codesign.txt
          echo '--- codesign verify (normalized primary) ---'
          cat dist/opentui-ios-renderer/codesign-verify.txt
          echo '--- codesign (unmodified A/B variant) ---'
          cat dist/opentui-ios-renderer/codesign-unmodified.txt
          echo '--- flags normalization ---'
          cat dist/opentui-ios-renderer/macho-flags-normalize.txt

      - name: Upload opentui-ios-renderer artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentui-ios-renderer
          path: dist/opentui-ios-renderer/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs (not part of the artifact contract)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentui-ios-build-logs
          path: |
            dist/opentui-build/zig-build.log
          if-no-files-found: warn
          retention-days: 14
