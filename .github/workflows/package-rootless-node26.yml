name: Package OpenCode with external node26 runtime

# Explicitly dispatched experimental line. The stable v2.2.5-ios.5 release is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: package-rootless-node26-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-node26:
    name: Assemble and validate both debs (device tests run separately)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve reviewed package pins
        id: pin
        run: |
          python3 - <<'PY'
          import json, os
          p = json.load(open('packaging/node26-dependent/pins.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for k in ('node_package_repository', 'node_package_run', 'node_package_artifact', 'cli_run', 'cli_artifact'):
                  print(f'{k}={p[k]}', file=output)
          PY
      - name: Download the independent runtime package
        run: gh run download '${{ steps.pin.outputs.node_package_run }}' -R '${{ steps.pin.outputs.node_package_repository }}' -n '${{ steps.pin.outputs.node_package_artifact }}' -D .artifacts/node26
      - name: Download the accepted CLI with signed renderer
        run: gh run download '${{ steps.pin.outputs.cli_run }}' -R "$GITHUB_REPOSITORY" -n '${{ steps.pin.outputs.cli_artifact }}' -D .artifacts/cli
      - name: Assemble OpenCode with exact node26 dependency
        run: |
          python3 scripts/package-dependent-node26.py \
            --node-package .artifacts/node26/node26_26.13.0-1_iphoneos-arm64.deb \
            --cli .artifacts/cli
          python3 scripts/check-macho-builtins.py .artifacts/cli/assets/@opentui/core-ios-arm64/libopentui.dylib
          bash -n packaging/node26-dependent/opencode
          bash -n packaging/rootless/usr/share/doc/opencode/device-smoke.sh
      - name: Validate Debian metadata and combined installed payload
        run: |
          set -euo pipefail
          cd dist/opencode-node26-dependent
          sha256sum -c SHA256SUMS
          test "$(dpkg-deb -f node26_26.13.0-1_iphoneos-arm64.deb Package)" = node26
          test "$(dpkg-deb -f node26_26.13.0-1_iphoneos-arm64.deb Author)" = nodejs
          test "$(dpkg-deb -f OpenCode-iOS-rootless-node26.deb Package)" = opencode
          test "$(dpkg-deb -f OpenCode-iOS-rootless-node26.deb Version)" = 2.2.5-2
          test "$(dpkg-deb -f OpenCode-iOS-rootless-node26.deb Depends)" = 'firmware (>= 15.0), node26 (= 26.13.0-1)'
          dpkg-deb --info OpenCode-iOS-rootless-node26.deb
          dpkg-deb --contents OpenCode-iOS-rootless-node26.deb
          mkdir extracted
          dpkg-deb --extract node26_26.13.0-1_iphoneos-arm64.deb extracted
          dpkg-deb --extract OpenCode-iOS-rootless-node26.deb extracted
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('extracted')
          report = json.load(open('package-report.json'))
          assert report['runtime_embedded'] is False
          assert report['depends'] == 'node26 (= 26.13.0-1)'
          assert all(c['status'] == 'PASS' for c in report['static_checks'])
          for item in report['files']:
              p = root / item['path']
              assert p.is_file() and not p.is_symlink(), item['path']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == item['sha256'], item['path']
              assert p.stat().st_mode & 0o777 == int(item['mode'], 8), item['path']
          for name, target in report['symlinks'].items():
              p = root / name
              assert p.is_symlink() and p.readlink().as_posix() == target, name
              assert p.resolve().is_relative_to(root.resolve()), name
              assert p.is_file(), name
          node = root / 'var/jb/usr/lib/node26/node'
          assert hashlib.sha256(node.read_bytes()).hexdigest() == report['source_pins']['node_sha256']
          assert (root/'var/jb/usr/bin/node').is_file()
          assert not (root/'var/jb/usr/bin/node26').exists()
          assert (root/'var/jb/usr/lib/opencode/runtime/node').resolve() == node.resolve()
          assert (root/'var/jb/usr/lib/nodejs26/node').resolve() == node.resolve()
          print('COMBINED_DEB_PASS', len(report['files']), 'app files;', len(report['static_checks']), 'static checks')
          print('DEVICE TESTS: NOT PERFORMED by CI; separate real-iPhone evidence required')
          PY
          git -C ../.. diff --exit-code
      - name: Record artifact checksums
        run: |
          {
            echo 'OpenCode experimental test.5: external node26 (= 26.13.0-1), command node, author nodejs.'
            echo 'CI assembly only. Real iPhone installation, CLI and PTY acceptance run separately.'
            echo 'Stable release v2.2.5-ios.5 is unchanged.'
            echo '```'
            cat dist/opencode-node26-dependent/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-ios-rootless-node26
          path: |
            dist/opencode-node26-dependent/*.deb
            dist/opencode-node26-dependent/SHA256SUMS
            dist/opencode-node26-dependent/package-report.json
          if-no-files-found: error
          retention-days: 14
