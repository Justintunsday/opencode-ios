name: Build OpenCode CLI iOS bundle

# Builds the OpenCode CLI as a Vite ESM bundle (`opencode.mjs` + `assets/`)
# for the native iPhoneOS Node.js 22.9.0 runtime, using upstream's official
# Node distribution path (`packages/cli/script/build-node.ts --bundle-only`).
#
# The smoke tests in this workflow run the bundle on *stock host Node.js*
# binaries downloaded from nodejs.org on the macOS runner. They prove the
# bundle loads and the CLI starts; they are NOT device verification. Device
# execution remains user-verified (see docs/OPENCODE_BUILD.md).
#
# Artifact contract (consumed by package-rootless.yml / test-port.yml):
#   opencode-cli-node-ios/
#     opencode.mjs
#     assets/**
#     bundle-manifest.json
#     SHA256SUMS

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Bundle variants to build
        type: choice
        options: [all, node26]
        default: all
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-opencode.yml'
      - 'scripts/build-opencode-bundle.sh'
      - 'patches/opencode/**'
      - 'src/opencode-ios/**'
      - 'UPSTREAM.lock'
  pull_request:
    paths:
      - '.github/workflows/build-opencode.yml'
      - 'scripts/build-opencode-bundle.sh'
      - 'patches/opencode/**'
      - 'src/opencode-ios/**'
      - 'UPSTREAM.lock'

permissions:
  contents: read
  # Required to download the pinned `opentui-ios-renderer` artifact from an earlier run of
  # build-opentui-ios.yml in this repository (actions/download-artifact with run-id).
  actions: read

concurrency:
  group: build-opencode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all'
    name: CLI Node bundle (host smoke only, not device verification)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Bundle target: iPhoneOS target of the patched upstream Node build. It reuses
      # the Darwin code path but the patch series selects the non-SEA iOS prelude, the
      # iOS-only asset set (no desktop native addons) and OPENCODE_IOS=1 behaviour.
      OPENCODE_TARGET: ios-arm64
      OPENCODE_IOS: '1'
      # Stock host Node versions used for smoke testing. 22.9.0 is the version
      # the shipped iPhoneOS runtime is compiled from; 24.x/26.4.0 are
      # informational (upstream's supported Node build is 26.4.0).
      OPENCODE_NODE_MATRIX: '22.9.0 24.22.2 26.4.0'
      # Version whose `--version`/`--help` (plus the deeper no-network commands) must
      # pass for this job to be green: the shipped iPhoneOS runtime version.
      OPENCODE_SMOKE_REQUIRED: '22.9.0'
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Show pinned upstream versions
        run: |
          grep -E '^OPENCODE_(REPO|REF|VERSION)=' UPSTREAM.lock
          uname -a

      - name: Fetch pinned upstream OpenCode
        run: bash scripts/build-opencode-bundle.sh fetch

      - name: Apply iOS patch series
        run: bash scripts/build-opencode-bundle.sh patches

      - name: Set up Bun (upstream build tool only, not the iOS runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Cache bun downloads and stock Node runtimes
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            dist/node-runtimes
            upstream-src/opencode/packages/cli/.cache/node
          key: opencode-bundle-${{ runner.os }}-${{ hashFiles('UPSTREAM.lock') }}-${{ hashFiles('upstream-src/opencode/bun.lock') }}

      - name: Install upstream dependencies
        run: bash scripts/build-opencode-bundle.sh install

      - name: Build Vite Node bundle (--bundle-only, no SEA)
        run: bash scripts/build-opencode-bundle.sh build

      - name: Stage iOS artifact
        run: bash scripts/build-opencode-bundle.sh stage

      - name: Host-Node smoke matrix (not device verification)
        run: bash scripts/build-opencode-bundle.sh smoke

      - name: Write bundle-manifest.json and SHA256SUMS
        run: bash scripts/build-opencode-bundle.sh manifest

      - name: Verify artifact checksums
        run: bash scripts/build-opencode-bundle.sh verify

      - name: Show artifact summary
        run: |
          set -euo pipefail
          du -sh dist/opencode-cli-node-ios
          find dist/opencode-cli-node-ios -type f | sort | sed -n '1,40p'
          echo '--- SHA256SUMS ---'
          cat dist/opencode-cli-node-ios/SHA256SUMS
          echo '--- manifest summary ---'
          python3 - <<'PY'
          import json
          with open('dist/opencode-cli-node-ios/bundle-manifest.json') as f:
              m = json.load(f)
          print(json.dumps({
              'upstream': m['upstream'],
              'patches': {'count': m['patches']['count'], 'series_sha256': m['patches']['series_sha256']},
              'build': {k: m['build'][k] for k in ('target', 'ios_prelude', 'bun_version')},
              'bundle': {
                  'opencode_mjs_sha256': m['bundle']['opencode_mjs']['sha256'],
                  'opencode_mjs_bytes': m['bundle']['opencode_mjs']['bytes'],
                  'assets_count': m['bundle']['assets']['count'],
                  'asset_categories': m['bundle']['assets']['categories'],
              },
              'smoke_required_passed': m['verification_status']['host_smoke_required_passed'],
              'smoke_required_node_version': m['verification_status']['host_smoke_required_node_version'],
              'device_verified': m['verification_status']['device_verified'],
          }, indent=2))
          PY

      - name: Upload opencode-cli-node-ios artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-node-ios
          path: dist/opencode-cli-node-ios/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build metadata (not part of the artifact contract)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-build-metadata
          path: |
            dist/opencode-build/
          if-no-files-found: warn
          retention-days: 14

  # Conditional fallback variant (hedge): the device-proven Node 18.20.4 iPhoneOS runtime.
  # It is a separate artifact (`opencode-cli-node18-ios`) and does not replace the default
  # Node 22 bundle. It adds patch 0007 (Node 18 prelude/shim) and a pinned sql.js WebAssembly
  # payload that implements node:sqlite, which Node 18 lacks. Host smoke requires Node 18.20.4.
  bundle-node18:
    if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all'
    name: CLI Node 18 fallback bundle (hedge variant, host smoke only)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      OPENCODE_TARGET: ios-arm64
      OPENCODE_IOS: '1'
      OPENCODE_IOS_NODE18: '1'
      OPENCODE_ARTIFACT_DIR: dist/opencode-cli-node18-ios
      OPENCODE_ARTIFACT_NAME: opencode-cli-node18-ios
      # Node 18.20.4 is the fallback runtime version; Node 22.9.0 is informational only.
      OPENCODE_NODE_MATRIX: '18.20.4 22.9.0'
      OPENCODE_SMOKE_REQUIRED: '18.20.4'
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Show pinned upstream versions
        run: |
          grep -E '^OPENCODE_(REPO|REF|VERSION)=' UPSTREAM.lock
          uname -a

      - name: Fetch pinned upstream OpenCode
        run: bash scripts/build-opencode-bundle.sh fetch

      - name: Apply iOS patch series (Node 18 variant)
        run: bash scripts/build-opencode-bundle.sh patches

      - name: Set up Bun (upstream build tool only, not the iOS runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Cache bun downloads, stock Node runtimes and sql.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            dist/node-runtimes
            upstream-src/opencode/packages/cli/.cache/node
            dist/opencode-build/downloads
          key: opencode-bundle-node18-${{ runner.os }}-${{ hashFiles('UPSTREAM.lock') }}-${{ hashFiles('upstream-src/opencode/bun.lock') }}

      - name: Install upstream dependencies
        run: bash scripts/build-opencode-bundle.sh install

      - name: Build Node 18 Vite bundle (--bundle-only, no SEA)
        run: bash scripts/build-opencode-bundle.sh build

      - name: Stage Node 18 iOS fallback artifact
        run: bash scripts/build-opencode-bundle.sh stage

      - name: Host-Node smoke matrix Node 18.20.4 (not device verification)
        run: bash scripts/build-opencode-bundle.sh smoke

      - name: Write bundle-manifest.json and SHA256SUMS
        run: bash scripts/build-opencode-bundle.sh manifest

      - name: Verify artifact checksums
        run: bash scripts/build-opencode-bundle.sh verify

      - name: Show artifact summary
        run: |
          set -euo pipefail
          du -sh dist/opencode-cli-node18-ios
          cat dist/opencode-cli-node18-ios/SHA256SUMS
          python3 - <<'PY'
          import json
          with open('dist/opencode-cli-node18-ios/bundle-manifest.json') as f:
              m = json.load(f)
          print(json.dumps({
              'artifact': m['artifact'],
              'variant': m['variant'],
              'patches': {'count': m['patches']['count'], 'series_sha256': m['patches']['series_sha256']},
              'build': {k: m['build'][k] for k in ('target', 'variant', 'runtime_node_version', 'ios_prelude')},
              'opencode_mjs_sha256': m['bundle']['opencode_mjs']['sha256'],
              'assets_count': m['bundle']['assets']['count'],
              'smoke_required_passed': m['verification_status']['host_smoke_required_passed'],
              'smoke_required_node_version': m['verification_status']['host_smoke_required_node_version'],
              'device_verified': m['verification_status']['device_verified'],
          }, indent=2))
          PY

      - name: Upload opencode-cli-node18-ios artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-node18-ios
          path: dist/opencode-cli-node18-ios/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Node 18 build metadata (not part of the artifact contract)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-node18-build-metadata
          path: |
            dist/opencode-build/
          if-no-files-found: warn
          retention-days: 14

  # Phase D: Node 26.13.0 + node:ffi real-TUI bundle. It ships the prebuilt OpenTUI iPhoneOS
  # renderer (`opentui-ios-renderer` artifact from run 41582979506, clang/ld64-linked
  # and codesign-adhoc signed) as a CLI asset under the key
  # the patched OpenTUI FFI loader resolves: @opentui/core-ios-arm64/libopentui.dylib.
  # This job is static/host verification only: the end-to-end TUI is device-verified separately
  # with the FFI-enabled Node 26 iPhoneOS runtime (the current --without-ffi Phase A/B runtime
  # cannot load node:ffi and therefore cannot run the real TUI).
  bundle-node26:
    name: CLI Node 26 real-TUI bundle (host smoke only, not device verification)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      OPENCODE_TARGET: ios-arm64
      OPENCODE_IOS: '1'
      OPENCODE_IOS_NODE26: '1'
      OPENCODE_ARTIFACT_DIR: dist/opencode-cli-node26-ios
      OPENCODE_ARTIFACT_NAME: opencode-cli-node26-ios
      # 26.13.0 is the shipped runtime version and the required smoke version; 24.22.2 is
      # informational (the bundle must not hard-crash on a supported previous LTS either).
      OPENCODE_NODE_MATRIX: '26.13.0 24.22.2'
      OPENCODE_SMOKE_REQUIRED: '26.13.0'
      # Phase C renderer artifact, linked with Xcode clang/ld64 and signed with Apple
      # codesign ad-hoc + non-recursive compiler-rt (run 41582979506; Zig-linked/ldid-signed
      # dylibs map non-executable on the device). The sha256 is pinned and
      # scripts/build-opencode-bundle.sh re-verifies it plus the Mach-O before staging; the
      # manifest records the actual staged hash.
      OPENCODE_OPENTUI_IOS_DYLIB: dist/opentui-ios-renderer/libopentui.dylib
      OPENCODE_OPENTUI_IOS_DYLIB_SHA256: 4792df5d32e846339e8f9f29865a4e4596a0f34465424ec4c15f9e1152581868
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Show pinned upstream versions
        run: |
          grep -E '^OPENCODE_(REPO|REF|VERSION)=' UPSTREAM.lock
          uname -a
          echo "OpenTUI renderer dylib pinned sha256: $OPENCODE_OPENTUI_IOS_DYLIB_SHA256"

      - name: Fetch pinned upstream OpenCode
        run: bash scripts/build-opencode-bundle.sh fetch

      - name: Apply iOS patch series
        run: bash scripts/build-opencode-bundle.sh patches

      - name: Download OpenTUI iOS renderer artifact (Phase C, pinned run)
        uses: actions/download-artifact@v4
        with:
          name: opentui-ios-renderer
          run-id: '41582979506'
          github-token: ${{ github.token }}
          path: dist/opentui-ios-renderer

      - name: Verify OpenTUI renderer artifact (sha256 + Mach-O iPhoneOS dylib)
        run: |
          set -euo pipefail
          dylib="dist/opentui-ios-renderer/libopentui.dylib"
          test -f "$dylib"
          actual="$(sha256sum "$dylib" | awk '{print $1}')"
          echo "renderer dylib sha256: $actual"
          test "$actual" = "$OPENCODE_OPENTUI_IOS_DYLIB_SHA256"
          python3 scripts/check_macho.py "$dylib" --kind dylib --max-minos 16.1.1
          # The renderer must be Apple-codesign signed (ad-hoc): ldid-signed dylibs are mapped
          # non-executable by dyld on the device and SIGBUS when called.
          xcrun codesign --verify --verbose=2 "$dylib"
          codesign -dvv "$dylib" 2>&1 | grep -q 'Signature=adhoc'

      - name: Set up Bun (upstream build tool only, not the iOS runtime)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Cache bun downloads, stock Node runtimes and upstream node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            dist/node-runtimes
            upstream-src/opencode/node_modules
            upstream-src/opencode/packages/cli/node_modules
          key: opencode-bundle-node26-${{ runner.os }}-${{ hashFiles('UPSTREAM.lock') }}-${{ hashFiles('upstream-src/opencode/bun.lock') }}-${{ env.OPENCODE_OPENTUI_IOS_DYLIB_SHA256 }}

      - name: Install upstream dependencies
        run: bash scripts/build-opencode-bundle.sh install

      - name: Apply @opentui/core iOS native-asset dependency patch
        run: bash scripts/build-opencode-bundle.sh deps-patches

      - name: Mobile layout, input, frame output and config regression checks
        working-directory: upstream-src/opencode/packages/tui
        run: |
          bun run typecheck:tsc
          bun test --timeout 30000 test/mobile-ui.test.tsx test/mobile-terminal.test.ts test/config-v2.test.tsx test/feature-plugins/home-footer.test.ts test/feature-plugins/prompt-footer.test.tsx

      - name: Build Node 26 Vite bundle (--bundle-only, no SEA)
        run: bash scripts/build-opencode-bundle.sh build

      - name: Stage Node 26 real-TUI artifact
        run: bash scripts/build-opencode-bundle.sh stage

      - name: OpenTUI iOS renderer asset/resolver host check (not device verification)
        run: bash scripts/build-opencode-bundle.sh assetcheck

      - name: Host-Node smoke matrix Node 26.13.0 (not device verification)
        run: bash scripts/build-opencode-bundle.sh smoke

      - name: Write bundle-manifest.json and SHA256SUMS
        run: bash scripts/build-opencode-bundle.sh manifest

      - name: Verify artifact checksums
        run: bash scripts/build-opencode-bundle.sh verify

      - name: Show artifact summary
        run: |
          set -euo pipefail
          du -sh dist/opencode-cli-node26-ios
          ls -l dist/opencode-cli-node26-ios/assets/@opentui/core-ios-arm64/libopentui.dylib
          cat dist/opencode-cli-node26-ios/SHA256SUMS
          python3 - <<'PY'
          import json
          with open('dist/opencode-cli-node26-ios/bundle-manifest.json') as f:
              m = json.load(f)
          print(json.dumps({
              'artifact': m['artifact'],
              'variant': m['variant'],
              'patches': {
                  'count': m['patches']['count'],
                  'series_sha256': m['patches']['series_sha256'],
                  'dependency_count': m['patches']['dependency_count'],
                  'dependency_series_sha256': m['patches']['dependency_series_sha256'],
              },
              'build': {k: m['build'][k] for k in ('target', 'variant', 'runtime_node_version', 'ios_prelude', 'ffi')},
              'opentui_renderer': {
                  'asset_key': m['opentui_renderer']['asset_key'],
                  'bytes': m['opentui_renderer']['bytes'],
                  'sha256': m['opentui_renderer']['sha256'],
                  'sha256_matches_expected': m['opentui_renderer']['sha256_matches_expected'],
              },
              'opencode_mjs_sha256': m['bundle']['opencode_mjs']['sha256'],
              'assets_count': m['bundle']['assets']['count'],
              'smoke_required_passed': m['verification_status']['host_smoke_required_passed'],
              'smoke_required_node_version': m['verification_status']['host_smoke_required_node_version'],
              'device_verified': m['verification_status']['device_verified'],
          }, indent=2))
          PY

      - name: Upload opencode-cli-node26-ios artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-node26-ios
          path: dist/opencode-cli-node26-ios/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Node 26 build metadata (not part of the artifact contract)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-node26-build-metadata
          path: |
            dist/opencode-build/
          if-no-files-found: warn
          retention-days: 14
