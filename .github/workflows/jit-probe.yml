name: iOS JIT memory probe

# Diagnostic arm64-apple-ios executable reporting which executable-memory
# strategies work on the jailbroken target device, under two signatures:
#   jitprobe-2key    : platform-application + no-sandbox (currently shipped set)
#   jitprobe-jitkeys : + dynamic-codesigning + allow-unsigned-executable-memory
# Each test (A..H) is a separate process invocation because a SIGBUS in one
# strategy must not hide the results of the others. Never shipped in the .deb.

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/jit-probe/**'
      - '.github/workflows/jit-probe.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build iOS JIT probe executable (diagnostic only)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build probe executable for arm64-apple-ios
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p dist
          xcrun --sdk iphoneos clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -O2 -Wall -Wextra scripts/jit-probe/main.c -o dist/jitprobe-2key
          xcrun --sdk iphoneos clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -O2 -Wall -Wextra scripts/jit-probe/dlopen-probe.c -o dist/dlopenprobe-2key
          xcrun --sdk iphoneos clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -O2 -Wall -Wextra -dynamiclib scripts/jit-probe/ocprobe.c -o dist/libocprobe.dylib
          cp dist/jitprobe-2key dist/jitprobe-jitkeys
          cp dist/libocprobe.dylib dist/libocprobe-adhoc.dylib
          file dist/jitprobe-2key dist/dlopenprobe-2key dist/libocprobe.dylib
      - name: Sign both variants
        run: |
          set -euo pipefail
          brew install ldid >/dev/null 2>&1 || true
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>platform-application</key><true/>' \
            '  <key>com.apple.private.security.no-sandbox</key><true/>' \
            '</dict></plist>' > dist/entitlements-2key.plist
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>platform-application</key><true/>' \
            '  <key>com.apple.private.security.no-sandbox</key><true/>' \
            '  <key>dynamic-codesigning</key><true/>' \
            '  <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>' \
            '</dict></plist>' > dist/entitlements-jitkeys.plist
          ldid -Sdist/entitlements-2key.plist dist/jitprobe-2key
          ldid -Sdist/entitlements-2key.plist dist/dlopenprobe-2key
          ldid -Sdist/entitlements-jitkeys.plist dist/jitprobe-jitkeys
          # ldid cannot re-sign a clang-built dylib here (ldid assert); use Apple's
          # codesign for the dylib diagnostics: one with the 2-key entitlements,
          # one plain ad-hoc, to see whether either variant is executable on device.
          xcrun codesign --force --sign - --entitlements dist/entitlements-2key.plist dist/libocprobe.dylib
          xcrun codesign --force --sign - dist/libocprobe-adhoc.dylib
          ldid -e dist/jitprobe-2key > dist/entitlements-2key-signed.xml
          ldid -e dist/jitprobe-jitkeys > dist/entitlements-jitkeys-signed.xml
          python3 scripts/check_macho.py dist/jitprobe-2key --max-minos 16.1.1
          python3 scripts/check_macho.py dist/dlopenprobe-2key --max-minos 16.1.1
          python3 scripts/check_macho.py dist/libocprobe.dylib --kind dylib --max-minos 16.1.1
          python3 scripts/check_macho.py dist/libocprobe-adhoc.dylib --kind dylib --max-minos 16.1.1
          shasum -a 256 dist/jitprobe-2key dist/jitprobe-jitkeys dist/dlopenprobe-2key \
            dist/libocprobe.dylib dist/libocprobe-adhoc.dylib | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ios-jit-probe
          path: |
            dist/jitprobe-2key
            dist/jitprobe-jitkeys
            dist/dlopenprobe-2key
            dist/libocprobe.dylib
            dist/libocprobe-adhoc.dylib
            dist/entitlements-*.plist
            dist/entitlements-*-signed.xml
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7